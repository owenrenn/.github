# WHY this repo has CI at all: #469 Plan B moved the fleet's board-sync
# logic here, because a public repo's reusable workflow is callable cross-org and
# a private one is not. That made a community-health repo into a code repo.
#
# WHY the tests live here and not in the operations repo: the code EXECUTES from
# here. A suite in the operations repo asserting against a copy kept there would
# be a mirror test -- it proves the two copies agree, not that the shipped one works.
name: tests

on:
  # `.github/workflows/**`, not the two workflow files by name. The bounds check
  # below walks EVERY workflow in this directory, so a filter naming only the
  # files that exist today means workflow number three lands without the check
  # that covers it ever running -- a detector reporting clean over what it was
  # never triggered to look at (#557, #587).
  # `actions/**` included for the same reason the workflow glob is a glob and not
  # a file list: a composite action edited without triggering the suite that checks
  # it is a detector that never runs over the thing it was added to cover.
  #
  # PR only, no push re-run: the PR is the gate (#918). A PR run already tests the
  # change merged onto main, so re-running on push re-tested what had passed. The
  # list lived on the `push:` line as a YAML anchor; with that line gone it sits
  # here directly, as the one copy.
  pull_request: { paths: ["scripts/**", ".github/workflows/**", "actions/**"] }

jobs:
  test:
    runs-on: ubuntu-latest
    # Bounded for the same reason the reusable workflow next door is: omitted,
    # a job inherits GitHub's 360-minute default, and a stall bills for every
    # one of those minutes rather than stopping at a wall. This suite runs in
    # seconds; 10 is the fleet's standard ceiling-on-a-stall. (#587)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run card-shark-sync module tests
        run: node --test scripts/card-shark-sync/*.test.js
      - name: Run autoclose-guard module tests
        run: node --test scripts/autoclose-guard/*.test.js
      - name: Every workflow parses, and every job is bounded
        # Two assertions over one walk, both of which the node suite structurally
        # cannot make:
        #
        #   1. It PARSES the YAML. The node suite asserts against the file's
        #      TEXT (regexes over raw content); nothing in it parses the file as
        #      YAML. A broken indent passes all 27+ text assertions and is a
        #      fleet-wide outage the next time any stub repo calls this workflow.
        #   2. It asserts every job carries timeout-minutes. The operations
        #      repo's workflow guard makes this assertion over its OWN
        #      .github/workflows and cannot reach this repo -- yet this is
        #      exactly where the fleet's bound has to live, because a job calling
        #      a reusable workflow cannot carry the key itself. Left unwatched,
        #      that bound is one revert from gone, in the one repo no fleet
        #      scanner covers (#473).
        #
        # Structural, not a text regex: `timeout-minutes` appearing somewhere in
        # the file proves nothing about which job carries it, and the whole
        # point is that the bound sits on the job the fleet actually calls.
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          checked = exempt = 0
          problems = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              doc = yaml.safe_load(open(f)) or {}
              for name, job in (doc.get("jobs") or {}).items():
                  if not isinstance(job, dict):
                      continue
                  # A reusable-workflow CALLER cannot carry the key -- see the
                  # comment on the sync job. Counted rather than passed over in
                  # silence: a skip nobody can see is how a detector goes green
                  # over a real gap.
                  if "uses" in job:
                      exempt += 1
                      continue
                  checked += 1
                  if "timeout-minutes" not in job:
                      problems.append(
                          f"{f}:{name} sets no timeout-minutes -- it inherits "
                          "GitHub's 360-minute default (#587)"
                      )

          # A glob that matched nothing, or a rename that moved the workflows,
          # would otherwise report success having examined zero jobs.
          if checked == 0:
              problems.append("no jobs discovered -- the bounds check looked at nothing")

          print(f"== bounds: {checked} jobs checked, {exempt} reusable-workflow callers exempt ==")
          for p in problems:
              print(p, file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY
      - name: Every composite action parses, and every run step names its shell
        # WHY a separate assertion: a composite action's `run` step with no
        # `shell:` is accepted by every YAML parser and by `actions/checkout`,
        # and fails only when a CALLER invokes it -- in the caller's repo, on the
        # caller's release. The blast radius of the mistake is entirely outside
        # the repo that made it, which is the worst place for a defect to surface
        # and the reason this is worth a structural check rather than review.
        #
        # Also asserts the walk found something: an empty glob would otherwise
        # report success having examined nothing, the failure mode this repo's
        # other checks are explicitly shaped to avoid.
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          checked = 0
          problems = []
          for f in sorted(glob.glob("actions/*/action.yml")):
              doc = yaml.safe_load(open(f)) or {}
              runs = doc.get("runs") or {}
              if runs.get("using") != "composite":
                  continue
              for i, step in enumerate(runs.get("steps") or []):
                  if not isinstance(step, dict) or "run" not in step:
                      continue
                  checked += 1
                  if not step.get("shell"):
                      problems.append(
                          f"{f}: step {i} ({step.get('name', 'unnamed')!r}) has `run` "
                          "but no `shell` -- composite actions require it, and this "
                          "fails in the CALLER's workflow, not here"
                      )
              # An input declared required with a default is a contradiction the
              # runner resolves silently in favour of the default, which is how a
              # caller omits something load-bearing and never learns.
              for name, spec in (doc.get("inputs") or {}).items():
                  if isinstance(spec, dict) and spec.get("required") and "default" in spec:
                      problems.append(f"{f}: input {name!r} is required AND has a default")

          if checked == 0:
              problems.append("no composite run steps discovered -- this check looked at nothing")

          print(f"== composite actions: {checked} run steps checked ==")
          for p in problems:
              print(p, file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY
