# Card Shark membership sync — the two-way rule (#469 Plan B).
#
#   An issue carries a pm:* label IF AND ONLY IF it is on Card Shark.
#
# Called by a stub in each fleet repo. Subsumes what used to be two
# copy-pasted workflows: add-to-project.yml (pm-surface) and
# escalate-to-card-shark.yml (agent-zone). One source, because another copy of a
# body that must stay byte-identical is the defect class already tracked in
# #448 and #457.
#
# WHY the removal path resolves from the PROJECT side rather than reading
# issue.projectItems: projectItems does not traverse an org-owned repo's issue
# to a user-owned project, and it fails by returning an EMPTY LIST rather than an
# error -- so the obvious implementation would delete nothing and exit 0 in most
# fleet repos, forever. See scripts/card-shark-sync/sync.js resolveRemoval().
#
# WHY this repo is checked out explicitly below: actions/checkout in a REUSABLE
# workflow checks out the CALLER, not the repo the workflow lives in. Without
# the explicit `repository:` the require() finds the caller's tree and fails.
name: card-shark-sync

on:
  workflow_call:
    inputs:
      audience:
        description: "pm-surface or agent-zone — selects add-trigger semantics"
        required: true
        type: string
      track:
        # WHY A CALLER INPUT AND NOT A LOOKUP HERE: the board's Track is derived
        # from which repo an item came from, and the work-track repositories are
        # PRIVATE. GitHub returns 404 for those to an anonymous caller and will
        # not confirm they exist, so a work-repo list in this PUBLIC repo would
        # answer a question the platform declines to answer (AGENTS.md § The
        # content rule). The generic rule lives here; the private datum stays in
        # the private caller's own workflow file.
        #
        # Defaulting to Personal means exactly one caller in the fleet carries an
        # override, rather than twenty stubs restating a value they all share.
        description: "Board Track for items from this repo — Work or Personal"
        required: false
        default: "Personal"
        type: string
    secrets:
      # Declared so a caller that passes secrets explicitly (rather than
      # `secrets: inherit`) fails at the CALL boundary if it forgets this one,
      # instead of every write step 403ing individually, late and confusingly.
      ADD_TO_PROJECT_PAT:
        required: true

jobs:
  sync:
    # SKIP THE EVENTS THAT PROVABLY CHANGE NOTHING (#917). This job bills a
    # minute per run and fires on every label operation across the fleet, and
    # most of those operations cannot change the board: a `type:` or `product:`
    # label re-adds an item idempotently and re-mirrors fields that did not
    # move, and an agent-zone `opened` is always a noop. The rule, and the
    # reasoning for each clause, live in `shouldSync()` in
    # scripts/card-shark-sync/sync.js; sync.test.js EVALUATES this expression
    # over an event matrix and fails if the two disagree.
    #
    # ⚠️ #563 IS WHY THIS PLACEMENT HAD TO BE VERIFIED, NOT ASSUMED. The
    # concurrency group below keeps only the newest pending run per issue. If a
    # job skipped here still took a place in that group, a skipped `type:` run
    # could cancel a pending `pm:awareness` run and then do nothing -- the lost
    # escalation #563 fixed, with no surviving run left to decide from state.
    # The gate relies on a skipped job never entering the group; that was
    # verified live on an agent-zone caller after merge (details on the PR that
    # introduced this gate).
    #
    # One logical line via `>-` folding: every line sits at the same indent, so
    # YAML joins them with spaces rather than preserving newlines inside the
    # expression.
    if: >-
      (github.event.action == 'opened' && inputs.audience == 'pm-surface') ||
      ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && startsWith(github.event.label.name, 'pm:')) ||
      (github.event.action == 'labeled' && (startsWith(github.event.label.name, 'lane:') || contains(fromJSON('["P0","P1","P2","P3"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    # Omitted, this job inherits GitHub's 360-minute default. It fires on every
    # issues event across the whole fleet, which makes it the highest-frequency
    # job there is -- and overage BILLS rather than stopping at a wall, so an
    # unbounded stall here spends money quietly instead of failing loudly.
    #
    # 10 minutes is ~25x the observed max (p50 9s, p90 19s, max 24s over 100
    # runs) and matches the bound every other job in the fleet carries. It is a
    # ceiling on a stall, not a budget -- the paging loop's own maxPages cap is
    # what bounds the expected path.
    #
    # WHY the bound is HERE and not in each caller: a job that invokes a
    # reusable workflow with `uses:` cannot set timeout-minutes -- GitHub
    # permits only name/uses/with/secrets/needs/if/permissions on such a job and
    # rejects the workflow outright otherwise (verified with actionlint 1.7.7,
    # not assumed). So every stub in the fleet is bounded by this one line.
    timeout-minutes: 10
    # Every write in this job goes through the PAT below, not GITHUB_TOKEN --
    # this is the one permission a caller of a REUSABLE workflow cannot see, so
    # it stays minimal here rather than inheriting whatever the caller granted.
    permissions:
      contents: read
    # Label ops arrive as independent events. A demotion (remove pm:action, add
    # pm:awareness) fires two runs; without this, the `unlabeled` run's fresh
    # label read can land before the `labeled` run's board insert, decide
    # `remove`, and delete an item that was just re-added -- the exact
    # invariant (pm:* <=> on-board) this valve exists to hold. Same reasoning as
    # escalation-reconcile.yml's concurrency group.
    concurrency:
      group: card-shark-sync-${{ github.repository }}-${{ github.event.issue.number }}
      # false, not true: a cancelled run can land between the preservation
      # comment and the delete, which is exactly the unrecoverable half-step
      # that ordering exists to prevent. Queue behind the in-flight run instead.
      cancel-in-progress: false
    steps:
      - name: Check out the sync logic
        uses: actions/checkout@v7
        with:
          repository: owenrenn/.github
          # Callers are told to reference this reusable workflow as `@main`, not
          # a version tag, so this ref and the caller's `uses:` line always name
          # the same commit. Pinning a caller to `@v1` while this checkout stays
          # on `main` would run workflow-v1 against scripts-from-main -- a
          # silent split between the two halves of one release.
          ref: main
          path: .card-shark-sync

      - name: Decide what this event implies
        id: decide
        uses: actions/github-script@v9
        # WHY the input arrives via env rather than ${{ }} inside script:
        # interpolating an expression into a script body is the script-injection
        # shape GitHub's hardening guidance names. This particular input comes
        # from a committed stub and is not attacker-reachable, but the pattern is
        # worth not teaching -- this workflow is the fleet's template for reusable
        # workflows, and the next one may take a genuinely untrusted input.
        env:
          AUDIENCE: ${{ inputs.audience }}
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const { decideAction } = require(`${process.env.GITHUB_WORKSPACE}/.card-shark-sync/scripts/card-shark-sync/sync.js`);

            // A FRESH label read, not context.payload.issue.labels. The payload
            // describes the moment the event fired; an issue that lost one of two
            // pm:* labels must stay on the board, and only a current read can say.
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const currentLabels = issue.labels.map((l) => (typeof l === "string" ? l : l.name));

            const decision = decideAction({
              eventAction: context.payload.action,
              audience: process.env.AUDIENCE,
              eventLabel: context.payload.label?.name,
              currentLabels,
            });
            core.info(`decision=${decision.kind} — ${decision.reason}`);
            core.setOutput("kind", decision.kind);
            // Published so the field-mirror step below does not re-read the issue.
            // Same read, same moment, one API call instead of two.
            core.setOutput("labels", JSON.stringify(currentLabels));
            core.setOutput("backfill", decision.backfillLabel || "");
            core.setOutput("product", decision.applyProductLabel ? "yes" : "");

      - name: Backfill pm:awareness
        if: steps.decide.outputs.backfill != ''
        uses: actions/github-script@v9
        # Same reasoning as the AUDIENCE env above: this value is a step output,
        # not attacker input, but interpolating ${{ }} into a script body is the
        # pattern this file argues against in its own comments, and it is the
        # template the fleet copies. Route it through env like everything else.
        env:
          BACKFILL: ${{ steps.decide.outputs.backfill }}
        with:
          # The PAT, not GITHUB_TOKEN: issues-triggered workflows get a read-only
          # default token, so addLabels() 403s without it.
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [process.env.BACKFILL],
            });

      - name: Add to Card Shark
        id: add
        if: steps.decide.outputs.kind == 'add'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          # WHY the raw mutation instead of actions/add-to-project@v2: that action
          # FAILS with "Content already exists in this project" when the issue is
          # already on the board. That is not an edge case -- promoting an issue
          # from pm:awareness to pm:action means adding a second pm:* label to an
          # issue that is already there, so the routine promotion path went red
          # every time while producing the correct end state. A workflow that is
          # habitually red is one whose real failures nobody reads.
          #
          # addProjectV2ItemById is genuinely idempotent: measured 2026-08-13, it
          # returns the EXISTING item id for content already in the project (and
          # unarchives an archived one). Same call, no third-party action, and it
          # drops the Node-20 deprecation warning that action carries.
          script: |
            const PROJECT_ID = "PVT_kwHOABLEFc4BRJ30";
            const r = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                 addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                   item { id }
                 }
               }`,
              { projectId: PROJECT_ID, contentId: context.payload.issue.node_id },
            );
            core.info(`on Card Shark as ${r.addProjectV2ItemById.item.id}`);
            core.setOutput("itemId", r.addProjectV2ItemById.item.id);

      - name: Mirror Track, Priority and Engagement
        # WHY HERE AND NOT ONLY IN THE FOUR-HOURLY SWEEP: the sweep was the only
        # writer of these fields, so a newly-filed or relabelled issue sat with
        # the wrong ones for up to four hours. Measured 2026-09-09: the board's
        # non-delegable-queue view under-reported by 18%, and one of the items it
        # was hiding was the ticket its owner had just called the top blocker.
        #
        # ⚠️ THIS COVERS RELABELLING, not just creation, and it does so without a
        # new trigger: `decideAction` returns `add` for ANY labeled event on an
        # issue that CURRENTLY carries a pm:* label -- so applying `lane:decide`
        # to an item already on the board routes through this same path, and
        # addProjectV2ItemById returns the existing item id rather than erroring.
        # That property is load-bearing here; see #563 for why deciding from
        # current state rather than the event's label is what makes it work.
        #
        # ⚠️ The sweep REMAINS the reconciler and is not replaced. It is still the
        # only thing that heals a value set before a manual override, a label
        # changed while this run was a cancelled intermediate, and any item this
        # path lost. Sync-sets-fields is an ADDITION to the reconciler.
        if: steps.decide.outputs.kind == 'add' && steps.add.outputs.itemId != ''
        uses: actions/github-script@v9
        env:
          TRACK: ${{ inputs.track }}
          LABELS: ${{ steps.decide.outputs.labels }}
          ITEM_ID: ${{ steps.add.outputs.itemId }}
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const { computeUpdates } = require(`${process.env.GITHUB_WORKSPACE}/.card-shark-sync/scripts/card-shark-sync/fields.js`);

            // ONE read: the item's current single-select values AND the project's
            // field/option ids. The ticket that asked for this claimed it needed
            // no extra API call; that was wrong -- nothing here previously
            // resolved an option id. It does cost ZERO extra BILLED MINUTES,
            // which is the claim that actually mattered: Actions bills per JOB
            // with a one-minute minimum, so calls inside an existing job are free.
            const q = await github.graphql(
              `query($itemId: ID!) {
                 node(id: $itemId) {
                   ... on ProjectV2Item {
                     fieldValues(first: 30) {
                       nodes {
                         ... on ProjectV2ItemFieldSingleSelectValue {
                           name
                           field { ... on ProjectV2SingleSelectField { name } }
                         }
                       }
                     }
                     project {
                       id
                       fields(first: 50) {
                         nodes {
                           ... on ProjectV2SingleSelectField { id name options { id name } }
                         }
                       }
                     }
                   }
                 }
               }`,
              { itemId: process.env.ITEM_ID },
            );

            const item = q.node;
            if (!item || !item.project) {
              // Refuse rather than conclude. An unreadable item and an item with
              // no fields set look identical from here, and writing defaults over
              // the second would overwrite a human's judgement.
              core.warning("could not read the board item — fields left untouched this run; the four-hourly reconciler still covers them");
              return;
            }

            const valueOf = (fieldName) =>
              (item.fieldValues.nodes || []).find(
                (v) => v && v.field && v.field.name === fieldName,
              )?.name || null;

            const updates = computeUpdates({
              track: process.env.TRACK,
              labels: JSON.parse(process.env.LABELS || "[]"),
              current: {
                track: valueOf("Track"),
                priority: valueOf("Priority"),
                engagement: valueOf("Engagement"),
              },
            });

            if (!updates.length) {
              core.info("fields already correct — nothing to write");
              return;
            }

            const fields = (item.project.fields.nodes || []).filter((f) => f && f.id);
            for (const u of updates) {
              const field = fields.find((f) => f.name === u.fieldName);
              const option = field && (field.options || []).find((o) => o.name === u.optionName);
              if (!field || !option) {
                // ⚠️ WARN, DO NOT FAIL. A missing field or option is board
                // configuration drift, not a sync malfunction, and failing here
                // would make a workflow that every issue event runs habitually
                // red -- which is how real failures stop being read. It is never
                // silent: the reconciler sees the same gap on its next pass.
                core.warning(`no board option "${u.optionName}" for field "${u.fieldName}" — skipped`);
                continue;
              }
              await github.graphql(
                `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                   updateProjectV2ItemFieldValue(input: {
                     projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                     value: { singleSelectOptionId: $optionId }
                   }) { projectV2Item { id } }
                 }`,
                {
                  projectId: item.project.id,
                  itemId: process.env.ITEM_ID,
                  fieldId: field.id,
                  optionId: option.id,
                },
              );
              core.info(`${u.fieldName} = ${u.optionName}`);
            }

      - name: Apply product:<repo> label
        if: steps.decide.outputs.product != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [`product:${context.repo.repo}`],
            });

      - name: Remove from Card Shark
        if: steps.decide.outputs.kind == 'remove'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const { readBoard, resolveRemoval, preservationComment } = require(`${process.env.GITHUB_WORKSPACE}/.card-shark-sync/scripts/card-shark-sync/sync.js`);
            const PROJECT_ID = "PVT_kwHOABLEFc4BRJ30";

            // archivedStates is NOT optional. ProjectV2.items excludes archived
            // items by default and filters totalCount identically, so omitting it
            // makes the received-vs-declared guard read clean over a partial board.
            // __typename and repository.owner.login are equally load-bearing --
            // resolveRemoval refuses to match without them, which fails SILENTLY as
            // "nothing to remove".
            //
            // WHY resolve by NUMBER, not by re-fetching node(id: PROJECT_ID): that
            // form makes the read and the guard the SAME hardcoded value, so
            // asserting they match is dead code -- a `node(id: X)` query always
            // returns the node whose id is X. Resolving by the owner+number
            // instead means the two hardcoded board references in this file (this
            // constant, and the add path's project-url two steps up) are
            // independent, and a mismatch between them -- a recreated or
            // renumbered board -- fails loudly here instead of silently paging the
            // wrong board and reporting every removal `absent` forever.
            const BOARD_QUERY = `
              query($cursor: String) {
                user(login: "owenrenn") {
                  projectV2(number: 5) {
                    id
                    items(first: 100, after: $cursor, archivedStates: [ARCHIVED, NOT_ARCHIVED]) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          __typename
                          ... on Issue { number repository { name owner { login } } }
                        }
                        fieldValues(first: 50) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field { ... on ProjectV2FieldCommon { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

            // The paging loop, its page-0 guards and the retry live in sync.js so
            // the suite can execute them. They were inline here, which is how
            // #490 shipped: a defect nothing could reach.
            //
            // Cap, not a guess: several hundred items at 100/page is a
            // single-digit number of pages. Hitting 20 means the cursor stopped
            // advancing, on a workflow that fires on every label event across
            // the whole fleet -- left unbounded this loops to the job timeout.
            const board = await readBoard({
              runQuery: (cursor) => github.graphql(BOARD_QUERY, { cursor }),
              projectId: PROJECT_ID,
              maxPages: 20,
              maxAttempts: 3,
            });

            // ⚠️ ALLOWLIST, NOT A BLOCKLIST, and the distinction is the whole
            // safety property. Enumerating the failure statuses and letting
            // everything else fall through looks equivalent and is not: an
            // unenumerated status leaves board.nodes/received/declared all
            // `undefined`, and resolveRemoval's guard is `received !== declared`
            // -- which for `undefined !== undefined` is FALSE. The guard does not
            // fire, find() on [] matches nothing, and the run logs "nothing to
            // remove" and exits 0. A silent no-op on the malformed-SUCCESS path
            // is the exact failure this valve exists to prevent, and an earlier
            // draft of this block had it while carrying a comment asserting that
            // resolveRemoval's contract covered the case. It does not.
            //
            // So: proceed ONLY on an explicit `ok`. Any new status added to
            // readBoard fails closed here by default rather than open.
            if (board.status !== "ok") {
              const detail = {
                "no-project": "project owenrenn/projects/5 did not resolve",
                "wrong-project": `read project ${board.got}, expected ${PROJECT_ID}`,
                "truncated": "board read exceeded 20 pages — cursor not advancing",
                "malformed": `board response shape invalid — ${board.detail}`,
                // Loud on purpose, and only after the retries. A read that never
                // reconciles cannot tell "not on the board" from "did not see the
                // whole board", and the second must never be reported as the
                // first. The wording says STALE rather than "short": #490's live
                // failure received MORE than declared, under a message calling
                // it short.
                "inconsistent":
                  `board read never settled: received ${board.received} of ${board.declared} ` +
                  `after ${board.attempts} attempts (${board.reason}) — refusing to conclude absence`,
              }[board.status] || `board read returned an unhandled status: ${board.status}`;
              core.setFailed(detail);
              return;
            }
            if (board.attempts > 1) {
              // Worth a line in the log: a run that needed a retry is evidence of
              // concurrent board writes, which is the signal that a batch
              // operation is in flight rather than anything being wrong.
              core.info(`board read settled on attempt ${board.attempts} (concurrent board writes)`);
            }

            const r = resolveRemoval({
              boardNodes: board.nodes, received: board.received, declared: board.declared,
              owner: context.repo.owner, repo: context.repo.repo, number: context.issue.number,
            });

            if (r.status === "unreadable") {
              // Unreachable via readBoard, which returns `ok` only when the counts
              // agree. Kept for a future caller that does not pre-check -- but NOT
              // relied on as the backstop for the allowlist above: it compares
              // received against declared, and two `undefined`s compare equal, so
              // it cannot catch the case the allowlist exists to catch.
              core.setFailed(`board read short: received ${r.received} of ${r.declared} — refusing to conclude absence`);
              return;
            }
            if (r.status === "absent") {
              core.info("not on Card Shark — nothing to remove");
              return;
            }

            // Preserve first, delete second. If the comment fails, the delete does
            // not happen -- losing a hand-set date silently is the failure this
            // ordering exists to prevent.
            if (r.dates.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: preservationComment({ dates: r.dates, itemId: r.itemId }),
              });
            }

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!) {
                 deleteProjectV2Item(input: {projectId: $projectId, itemId: $itemId}) { deletedItemId }
               }`,
              { projectId: PROJECT_ID, itemId: r.itemId },
            );
            core.info(`removed ${r.itemId} from Card Shark`);
