# Reusable auto-close guard. Callers add a short stub; the decision logic and its
# test suite live here, once.
#
# WHY: GitHub auto-closes an issue on merge when a PR *registers* it as a closing
# reference — via a body keyword (`Closes/Fixes/Resolves #N`) OR via the
# Development sidebar. A prose disclaimer in the body ("does not close #N") does
# NOT override that registration. Four long-lived trackers were orphaned this way
# before the guard existed; the costliest sat closed and unnoticed for six weeks.
#
# The predicate leads with the *contradiction* (body says "reference", GitHub says
# "close"), which catches the case regardless of label, and keeps a project-type
# label plus a `no-autoclose` marker as second signals. A label-only predicate
# misses a watch ticket wearing some other type label — that is how the fourth
# orphaning happened.
#
# It also reports the INVERSE direction, the failure that gets missed because
# nothing red ever appears. GitHub needs a closing keyword before EACH number:
# `Closes #11, #12` registers **#11 alone** and reads #12 as a bare mention. An
# earlier version of this guard was GREEN on exactly that, because every check it
# ran was over `closingIssuesReferences` — the set GitHub computed — and the
# dropped number was never in it. An omission reads as an all-clear. So we compare
# the author's stated closing set against GitHub's computed one, both directions.
#
# And a THIRD signal, `prose-keyword`: a registered close whose every stating
# keyword sits MID-SENTENCE rather than leading its line. Honest prose about what
# a PR did *not* do is the densest source of accidental closes — "filed rather
# than", then the colon form of a closing verb, then a number — and the
# stated-vs-registered comparison cannot see it, because the parser reads that
# keyword as intent and both sets agree. Only the template form, `Closes #N` on a
# line of its own, counts as intentional (#911).
#
# ⚠️ It SETTLES before judging (#916). `closingIssuesReferences` is eventually
# consistent, and on `opened` it can still read EMPTY: the guard once reported OK
# over a PR whose close registered moments later, and a PR opened in its final
# form is only ever checked on `opened`. So while the body and the registered set
# disagree in a lag-shaped way (`unsettled` in the predicate), it waits and
# re-reads — up to 4 × 5s, inside the 1-minute billing floor — then evaluates the
# latest read regardless.
#
# Deliberately NOT "warn on every closing reference": most PRs legitimately close
# something, so that predicate fires nearly always and the warning becomes
# ignorable — which is how the orphaning recurs.
#
# ⚠️ It FAILS when declared and registered disagree (#942). It used to be
# advisory: it found the problem, wrote a comment, and exited `pass`, so the
# check row read green beside a finding nobody opened. That kept happening.
# The finding now lives on the status surface. DECLARED is a closing keyword on a
# line of its own and nothing else; write nothing and the PR declares it closes
# nothing (`verdict` in the predicate has the full rule and what it cannot see).
#
# ⚠️ Red, and NOT a required check. Callers must keep it out of their required
# set: a merge is never blocked by it. It clears on the next run once declared
# and registered agree. ⚠️ That needs a RUN: editing the body fires one, but a
# registration that arrives late, or a Development-sidebar link being removed,
# fires no event this workflow is called on. The comment tells the reader to
# re-run the check.
#
# ⚠️ CALLER CONTRACT: the stub MUST declare its own `permissions:` block. A called
# workflow cannot exceed the CALLING workflow's token permissions, and the repos
# calling this default that token to READ-ONLY — without it this guard parses,
# runs, and dies at the comment write. The stub is in AGENTS.md.
#
# Decision logic lives in `scripts/autoclose-guard/predicate.js` IN THIS REPO so it
# can be unit-tested (run by `tests.yml`). This file is I/O only.

name: auto-close guard

on:
  # ⚠️ The caller's stub owns the `types:` list. Closing references derive from
  # the PR body (keywords) and the Development-sidebar link, so a stub needs
  # `edited` for body changes plus `opened`/`reopened`/`ready_for_review` for the
  # lifecycle entry points. AGENTS.md carries the canonical stub.
  workflow_call:
    inputs:
      runner:
        # WHY A CALLER INPUT: the runner a job lands on is the CALLER's to choose,
        # because a self-hosted runner belongs to one repository (or one org) and
        # this body cannot know whether its caller has one. A caller that does
        # passes its own runner label, normally through its own fallback
        # expression so one variable returns it to hosted runners. Everyone else
        # passes nothing and runs hosted, exactly as before this input existed.
        #
        # WHY NOT a `vars` read in here: the routing has to be visible in the
        # CALLER's workflow file. That is where a caller's own tests can see which
        # of its workflows may reach a runner in its house, and a choice made in
        # this file would be one they cannot read.
        description: "Runner label for this job. Omit for a GitHub-hosted runner."
        required: false
        default: "ubuntu-latest"
        type: string
      logic_ref:
        # WHICH COMMIT the decision logic is read from. Every caller but one omits
        # it and gets `main`, the same ref their stub resolves this file at.
        #
        # WHY it exists: this workflow file and the predicate it loads are two
        # files fetched two ways. A caller's `uses:` pins the FILE; the checkout
        # below fetched the predicate from `main` regardless. So this repo's own
        # PRs ran the PR's workflow against main's predicate: a PR that changed
        # both could not be checked before merge, and the one that added
        # `verdict` crashed on itself with "verdict is not a function".
        #
        # This repo's own caller passes `github.sha`, the SAME commit its
        # `uses: ./…` resolves the workflow file at. On `pull_request` that is
        # the test-merge commit, not the PR's head: the head alone would skew
        # the other way as soon as main moved under an open PR.
        #
        # ⚠️ Not for other callers. Pinning the logic to anything but `main` while
        # the stub resolves this file at `@main` recreates the same skew.
        description: "Commit of this repo to read the decision logic from. Only this repo's own caller sets it."
        required: false
        default: "main"
        type: string

# WHY: serialize per-PR so a burst of events (open + edit) can't race past
# the marker check and post duplicate warnings — same failure the
# a sibling gate in this fleet hit. cancel-in-progress: false lets the
# in-flight write finish; the newest event still runs last.
concurrency:
  group: autoclose-guard-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      pull-requests: write   # upsert/delete the guard's comment
      issues: read           # read tracker labels + stated-close issue states
      contents: read         # checkout, for the predicate module
    steps:
      # WHY checkout: the predicate module is read from disk. Without it the
      # `require` below throws and the step fails — the intended fail-closed
      # behaviour. A guard that silently skips itself is worse than no guard,
      # because it still reads as "checked" in the PR timeline.
      #
      # ⚠️ `repository:` IS LOAD-BEARING. With no `repository:` this checks out
      # the CALLER, which does not carry the predicate — the guard would then
      # crash on every run in every consuming repo. A reusable workflow does not
      # bring its own repo's files.
      - name: Check out the guard logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: owenrenn/.github
          ref: ${{ inputs.logic_ref }}
          path: .autoclose-guard

      # WHY a SHA and not `@v9`: on 2026-08-17 this step failed once with
      # `Resource not accessible by integration` and was green again 52 minutes
      # later with no commit here — a floating major can change under us with
      # nothing in this repo to diff against. Pinning makes the action's
      # version a fact of this file.
      #
      # ⚠️ Kept pinned on the way into this repo, where the neighbouring
      # reusable workflow still floats on tags. That is a deliberate divergence,
      # not an oversight: the incident above is the reason, and a guard whose
      # action can change under it is a guard you cannot reason about. Nothing
      # here asserts the pin yet — no structural test in this repo covers it.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const { verdict, renderComment, unsettled, MARKER } =
              require(`${process.env.GITHUB_WORKSPACE}/.autoclose-guard/scripts/autoclose-guard/predicate.js`);

            // Separate marker so the self-heal can't delete a crash notice, and
            // a crash can't masquerade as a finding.
            const ERROR_MARKER = "<!-- autoclose-guard:error -->";
            const { owner, repo } = context.repo;

            const listMarkerComments = async (marker) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              // WHY Bot + body guard: only manage our own bot comments; a human
              // comment quoting the marker must never be deletable by us.
              return comments.filter(
                c => c.user?.type === "Bot" && c.body && c.body.includes(marker),
              );
            };

            const dropComment = async (id, what) => {
              // WHY: janitorial deletes are best-effort — a failed delete must
              // not abort the guard's actual contract. Warn, continue.
              try {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: id });
              } catch (e) {
                core.warning(`Could not delete ${what} comment ${id}: ${e.message}`);
              }
            };

            const main = async () => {
              const here = `${owner}/${repo}`;

              // WHY GraphQL: `closingIssuesReferences` is GitHub's computed set
              // of issues this PR will close on merge — it already folds in both
              // body keywords and sidebar links, so we read the source of truth
              // rather than re-parsing the body for closing intent (which would
              // miss sidebar-only links, exactly how #190 and #337 slipped).
              //
              // Each node carries its REPOSITORY (#942): the verdict compares by
              // repository and number, so a cross-repository close is matched to
              // its own declaration and never to a local issue that happens to
              // share its number.
              const QUERY = `
                query($owner:String!, $repo:String!, $pr:Int!) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$pr) {
                      closingIssuesReferences(first: 25) {
                        totalCount
                        nodes {
                          number
                          title
                          state
                          repository { nameWithOwner }
                          labels(first: 20) { nodes { name } }
                        }
                      }
                    }
                  }
                }`;
              const readClosingRefs = async () => {
                let data;
                try {
                  data = await github.graphql(QUERY, { owner, repo, pr: pr.number });
                } catch (e) {
                  // ⚠️ An issue in a repository this token cannot read comes back as
                  // a `null` node WITH an error, and the client throws on any error.
                  // The partial data is still the answer for everything it CAN
                  // read, so use it. No partial data at all is a real failure.
                  if (!e?.data?.repository?.pullRequest) throw e;
                  core.warning(`closingIssuesReferences returned partial data: ${e.message}`);
                  data = e.data;
                }
                const conn = data.repository.pullRequest.closingIssuesReferences;
                const nodes = conn.nodes || [];
                // One page is all this reads. A PR registering more than that is
                // refused, not judged on the first 25: a declared close on the
                // second page would read as "unregistered".
                if (typeof conn.totalCount === "number" && conn.totalCount > nodes.length) {
                  throw new Error(`${conn.totalCount} registered closing references, and this check reads ${nodes.length}: it cannot judge a set it has not seen`);
                }
                // A node is READABLE only if it says which repository it is in.
                // One that does not cannot be attributed, and calling it local
                // would let it match a local `Closes #N` by number alone.
                const readable = nodes.filter(n => n && n.repository?.nameWithOwner);
                return {
                  refs: readable.map(n => ({
                    repo: n.repository.nameWithOwner,
                    number: n.number,
                    title: n.title,
                    state: n.state,
                    labels: (n.labels?.nodes || []).map(l => l.name),
                  })),
                  // Registered, and unreadable with this token. Counted, never dropped:
                  // the verdict decides whether the body's declarations account for them.
                  invisible: nodes.length - readable.length,
                };
              };

              // ⚠️ SETTLE BEFORE JUDGING (#916). The registered set lags a body
              // write, and on `opened` it read EMPTY for a PR whose close
              // registered moments later — the guard said OK, and a PR opened in
              // its final form gets no later run. So while body and registered
              // set disagree in a lag-shaped way (see `unsettled`), wait and
              // re-read; then judge the LATEST read regardless, so a genuine
              // mismatch still reports — just seconds later.
              const RETRIES = 4, WAIT_MS = 5000;
              let read = await readClosingRefs();
              for (let attempt = 1; attempt <= RETRIES; attempt++) {
                const pending = unsettled(pr.body || "", read.refs, here);
                if (pending.length === 0) break;
                core.info(`registered set not settled for ${pending.join(", ")}; re-reading in ${WAIT_MS / 1000}s (attempt ${attempt}/${RETRIES})`);
                await new Promise(r => setTimeout(r, WAIT_MS));
                read = await readClosingRefs();
              }

              const judge = (issueStates, crossStates = {}) => verdict({
                closingRefs: read.refs, invisibleRegistered: read.invisible,
                body: pr.body || "", repoSlug: here, issueStates, crossStates,
              });

              // Resolve the issues the body DECLARES it closes that GitHub did
              // not register, so the verdict can tell "still open" from "already
              // closed, so harmless". Asked of a first pass with no states, so
              // the lists are the predicate's and not a second parse. Capped at
              // 25 to match the bound above.
              const first = judge({});
              // ⚠️ Only numbers GraphQL can carry. One over-range number in the
              // aliased query below gets the WHOLE query rejected, and every
              // neighbour then loses its state and reads "could not read".
              const unresolved = first.unregistered.map(u => u.number)
                .filter(n => Number.isSafeInteger(n) && n > 0 && n <= 2147483647)
                .slice(0, 25);
              const issueStates = {};
              if (unresolved.length > 0) {
                const aliases = unresolved
                  .map((n, i) => `i${i}: issue(number: ${n}) { number title state }`)
                  .join("\n                      ");
                const keep = (bag) => {
                  for (const node of Object.values(bag || {})) {
                    if (node) issueStates[node.number] = { state: node.state, title: node.title };
                  }
                };
                try {
                  const res = await github.graphql(`
                    query($owner:String!, $repo:String!) {
                      repository(owner:$owner, name:$repo) {
                      ${aliases}
                      }
                    }`,
                    { owner, repo }
                  );
                  keep(res?.repository);
                } catch (e) {
                  // A number that names no issue errors with partial data. What
                  // was read is kept. What was NOT read stays out of the map,
                  // and the verdict treats a declared close it could not read as
                  // a failure: an omission must never read as an all-clear.
                  keep(e?.data?.repository);
                  core.warning(`Could not resolve every declared-close issue state: ${e.message}`);
                }
              }

              // The same question for a declared close in ANOTHER repository,
              // and it doubles as the measurement of whether this token can see
              // that repository at all. Readable: the verdict judges it like a
              // local one. Unreadable: it stays "unverifiable", said and not
              // failed. One small query each, so one private repository cannot
              // cost the others their answer.
              const crossStates = {};
              for (const key of first.unverifiable.slice(0, 10)) {
                const cut = key.lastIndexOf("#");
                const [crossOwner, crossRepo] = key.slice(0, cut).split("/");
                const number = Number(key.slice(cut + 1));
                if (!(Number.isSafeInteger(number) && number > 0 && number <= 2147483647)) continue;
                try {
                  const res = await github.graphql(`
                    query($owner:String!, $repo:String!, $number:Int!) {
                      repository(owner:$owner, name:$repo) { issue(number:$number) { number title state } }
                    }`,
                    { owner: crossOwner, repo: crossRepo, number }
                  );
                  const issue = res?.repository?.issue;
                  if (issue) crossStates[key] = { state: issue.state, title: issue.title };
                } catch (e) {
                  core.info(`${key} is not readable with this token: ${e.message}`);
                }
              }

              const v = judge(issueStates, crossStates);
              // The two sets, in the run log on every run. When a verdict looks
              // wrong, this is the first thing anyone needs and the one thing the
              // comment does not carry in full.
              core.info(`registered: ${read.refs.map(r => `${r.repo}#${r.number}(${r.state})`).join(", ") || "none"}${read.invisible ? ` + ${read.invisible} unreadable` : ""}`);
              core.info(`verdict: ${JSON.stringify({ fail: v.fail, accidental: v.accidental.map(a => a.key), protected: v.protected.map(p => p.key), unregistered: v.unregistered.map(u => u.key), unverifiable: v.unverifiable, unseen: v.unseen })}`);

              // Gather existing marker comments (self-heal dupes, like the
              // label gate — keep the first as canonical, delete the rest).
              const markerComments = await listMarkerComments(MARKER);
              const existing = markerComments[0] || null;
              for (const dupe of markerComments.slice(1)) {
                await dropComment(dupe.id, "duplicate marker");
              }
              // A run that got this far did not crash; clear any stale notice.
              for (const stale of await listMarkerComments(ERROR_MARKER)) {
                await dropComment(stale.id, "stale crash-notice");
              }

              const body = renderComment(v);

              // WHY self-heal: when declared and registered agree again, remove
              // the stale comment so the PR doesn't carry a false alarm.
              if (body === null) {
                if (existing) await dropComment(existing.id, "resolved guard");
                core.info("Declared and registered agree. OK.");
                return;
              }

              // ⚠️ A comment that cannot be WRITTEN is not a crash. On a fork PR
              // the token is read-only and this write 403s. The verdict was
              // still reached, so the job still fails on it below. Letting the
              // 403 reach the crash handler reported "this PR was NOT checked",
              // which is false, on the one signal left.
              try {
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: existing.id, body,
                  });
                  core.info(`Updated guard comment on PR #${pr.number}.`);
                } else {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: pr.number, body,
                  });
                  core.info(`Posted guard comment on PR #${pr.number}.`);
                }
              } catch (e) {
                core.warning(`The verdict stands, but this run could not write the comment that explains it: ${e.message}. The verdict is in this run's log.`);
              }

              // ⚠️ THE POINT OF #942. The comment above was always written, and
              // always correct, and the check row stayed green beside it. The row
              // is the surface people act on, so the finding goes there: a
              // failing verdict fails the job. AFTER the comment, so the red row
              // always has its explanation. Not a required check, so it never
              // blocks a merge.
              if (v.fail) {
                core.setFailed(`declared closes do not match what merging will do: ${[
                  v.accidental.length && `${v.accidental.length} will close undeclared`,
                  v.protected.length && `${v.protected.length} carry no-autoclose`,
                  v.unregistered.length && `${v.unregistered.length} unregistered so far`,
                  v.unseen && `${v.unseen} unreadable and undeclared`,
                ].filter(Boolean).join(", ")}. See the comment on this PR.`);
              } else {
                // Only an unverifiable cross-repository close: said, not failed.
                core.warning(`this token cannot verify the declared close(s) in another repository: ${v.unverifiable.join(", ")}`);
              }
            };

            // WHY surface a crash in the PR timeline: a red check in a repo
            // where nothing can gate a merge trains the eye to
            // scroll past it, and "the guard crashed" then looks identical to
            // "the guard ran and found something". A comment says which.
            //
            // ⚠️ This CANNOT cover the other way this guard goes missing: when
            // Actions will not start the job at all (exhausted minutes, a failed
            // payment, a spending limit), no step runs, so nothing here can
            // speak. That gap belongs to a billing alarm, not to this file.
            try {
              await main();
            } catch (e) {
              const body = [
                ERROR_MARKER,
                "🛑 **The auto-close guard crashed — this PR was NOT checked.**",
                "",
                "```",
                String(e.message || e),
                "```",
                "",
                "Check by hand before merging; an unchecked PR is not a clean one:",
                "",
                "```bash",
                `gh api graphql -f query='{ repository(owner:"${owner}", name:"${repo}") { pullRequest(number:${pr.number}) { closingIssuesReferences(first:25){ nodes { number title state } } } } }'`,
                "```",
                "",
                "Compare that list against every `Closes`/`Fixes`/`Resolves` in the body — they are supposed to agree.",
              ].join("\n");

              try {
                const stale = await listMarkerComments(ERROR_MARKER);
                if (stale[0]) {
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: stale[0].id, body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: pr.number, body,
                  });
                }
              } catch (postErr) {
                // The crash may BE the comment API (that is what failed on
                // seen at least once), so this path may itself fail.
                core.warning(`Could not post the crash notice: ${postErr.message}`);
              }

              core.setFailed(`auto-close guard crashed: ${e.message || e}`);
            }
